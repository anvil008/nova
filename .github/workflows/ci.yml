name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: v3 skill tests + docs-check
        run: |
          for t in planner build research code-review docs; do
            python3 -B harness-agents/v3/skills/$t/tests/test_${t//-/_}.py
          done
