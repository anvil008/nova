name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go build ./...
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test -v ./...
      - name: Hook tests
        run: bash scripts/hooks/tests/test_hooks.sh
      - name: Skill unit tests
        run: |
          python3 -m unittest discover -s skills/planner/tests -p "test_*.py"
          python3 -m unittest discover -s skills/build/tests -p "test_*.py"
          python3 -m unittest discover -s skills/code-review/tests -p "test_*.py"
          python3 -m unittest discover -s skills/docs/tests -p "test_*.py"
          python3 -m unittest discover -s skills/research/tests -p "test_*.py"
      - name: Docs check
        run: python3 skills/docs/scripts/docs_check.py .
