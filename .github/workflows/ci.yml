name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -count=1 -race ./runplane -run 'Worker|Send|Cancel|Recover|Replay|Visibility|Durability'
      - run: go run ./cmd/codingfleet render --check
      - run: go run ./cmd/swarm-runplane conformance --offline --definitions harness-agents/rendered
