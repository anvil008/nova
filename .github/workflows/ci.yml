name: CI
# A bare `push:` alongside `pull_request:` builds every branch twice while a PR is open:
# once for the branch tip, once for its synthetic merge into the base. Direct pushes are
# scoped to the default branch; every other branch is covered by its pull request.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python lint tooling
        run: python3 -m pip install ruff
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go build ./...
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test -count=1 -race ./...
      - name: Shell tests
        run: |
          for test_script in scripts/hooks/tests/test_*.sh scripts/tests/test_*.sh; do
            bash "$test_script"
          done
      - name: Script Python tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Ruff
        run: ruff check skills/ evals/ scripts/render-diagrams.py
      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh scripts/hooks/build-*
      - name: Skill unit tests
        run: |
          for d in skills/*/tests; do
            python3 -m unittest discover -s "$d" -p 'test_*.py'
          done
      - name: Skill evals
        run: |
          python3 evals/run_evals.py --structural
          python3 evals/run_evals.py --min-rank1 77
          python3 -m unittest discover -s evals/tests -p 'test_*.py'
      - name: Docs check
        run: python3 skills/docs/scripts/docs_check.py .
      - name: Agent definitions in sync
        run: python3 scripts/sync-agents.py --check --diff
      - name: Agent models in sync
        run: python3 scripts/sync-agent-models.py --check
      - name: Diagrams in sync
        run: python3 scripts/render-diagrams.py --check
