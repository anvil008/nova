<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" role="img" aria-labelledby="title description">
  <title id="title">How nova-test keeps test output out of the context window</title>
  <desc id="description">nova-test wraps any test command. It runs the command directly with execvp, capturing stdout, stderr, and wall time. On exit code 0 it prints only the framework summary, about 20 tokens. On a non-zero exit code it prints the raw stdout and stderr untouched and returns the same exit code. Across a ten-turn session with twenty test runs this preserves roughly 35,000 tokens of context. Summary extraction is built in for Rust, Go, Python, Node and TypeScript, C and C++, and Java or Kotlin.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669"/></marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#e11d48"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .heading { font-size: 21px; font-weight: 650; fill: #0f172a; }
      .body { font-size: 16px; fill: #475569; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; fill: #0f766e; }
      .number { font-size: 16px; font-weight: 700; fill: #0f766e; }
      .code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="1000" rx="20" fill="#f8fafc"/>
  <text x="48" y="42" class="label">NOVA / TOKEN-EFFICIENT VERIFICATION</text>
  <rect x="48" y="58" width="804" height="148" rx="14" fill="#0f172a"/>
  <text x="72" y="94" font-size="22" font-weight="650" fill="#ffffff">nova-test: quiet on success,</text>
  <text x="72" y="120" font-size="22" font-weight="650" fill="#ffffff">full traces on failure.</text>
  <text x="72" y="148" font-size="16" fill="#cbd5e1">Wrap any test command.</text>
  <text x="72" y="169" font-size="16" fill="#cbd5e1">Keep the context window for code, not passing noise.</text>
  <text x="72" y="193" class="code" font-size="14" font-weight="600" fill="#5eead4">nova-test pytest &#183; nova-test cargo test &#183; nova-test go test</text>
  <path d="M 450 206 V 226" class="line"/>
  <rect x="48" y="228" width="804" height="104" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="80" cy="258" r="16" fill="#ccfbf1"/><text x="75" y="264" class="number">1</text>
  <text x="110" y="265" class="heading">Run the command directly</text>
  <text x="72" y="296" class="body">Executes via execvp with no shell.</text>
  <text x="72" y="318" class="body">Captures stdout, stderr, and wall time.</text>
  <path d="M 450 332 V 352" class="line"/>
  <rect x="350" y="356" width="200" height="40" rx="20" fill="#0f172a"/>
  <text x="450" y="382" text-anchor="middle" font-size="17" font-weight="650" fill="#ffffff">Exit code?</text>
  <path d="M 400 396 V 420 H 243 V 440" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#green-arrow)"/>
  <rect x="276" y="396" width="46" height="20" rx="6" fill="#d1fae5"/>
  <text x="299" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">0</text>
  <path d="M 500 396 V 420 H 657 V 440" fill="none" stroke="#e11d48" stroke-width="2" marker-end="url(#red-arrow)"/>
  <rect x="578" y="396" width="56" height="20" rx="6" fill="#ffe4e6"/>
  <text x="606" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#9f1239">&#8800; 0</text>
  <rect x="48" y="440" width="390" height="196" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="72" y="474" font-size="21" font-weight="650" fill="#065f46">Quiet</text>
  <text x="72" y="496" font-size="15" font-weight="600" fill="#047857">exit 0</text>
  <rect x="58" y="506" width="370" height="74" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="70" y="525" class="code" font-weight="600" fill="#065f46">&#10003; [nova-test] Succeeded in 2.3s</text>
  <text x="70" y="547" class="code" fill="#334155">Ran 183 tests in 2.1s</text>
  <text x="70" y="569" class="code" fill="#334155">OK</text>
  <text x="72" y="602" font-size="15" fill="#047857">Only the framework summary.</text>
  <text x="72" y="622" font-size="15" fill="#047857">About 20 tokens.</text>
  <rect x="462" y="440" width="390" height="196" rx="12" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="486" y="474" font-size="21" font-weight="650" fill="#9f1239">Full traces</text>
  <text x="486" y="496" font-size="15" font-weight="600" fill="#be123c">exit &#8800; 0</text>
  <rect x="472" y="506" width="370" height="74" rx="8" fill="#ffffff" stroke="#fda4af"/>
  <text x="484" y="525" class="code" font-weight="600" fill="#be123c">&#10007; [nova-test] Failed in 0.4s:</text>
  <text x="484" y="547" class="code" fill="#475569">FAIL: test_parse (test_cli)</text>
  <text x="484" y="569" class="code" fill="#475569">AssertionError: 3 != 4</text>
  <text x="486" y="602" font-size="15" fill="#be123c">Raw stdout and stderr.</text>
  <text x="486" y="622" font-size="15" fill="#be123c">Same exit code returned.</text>
  <rect x="48" y="656" width="804" height="220" rx="12" fill="#0f172a"/>
  <text x="72" y="690" font-size="21" font-weight="650" fill="#ffffff">Why it compounds</text>
  <text x="72" y="714" font-size="16" fill="#cbd5e1">10-turn session, 20 test runs:</text>
  <text x="72" y="742" font-size="15" font-weight="600" fill="#fecdd3">Raw output &#183; ~36,800 tokens</text>
  <rect x="72" y="750" width="756" height="16" rx="6" fill="#f43f5e"/>
  <text x="72" y="792" font-size="15" font-weight="600" fill="#a7f3d0">With nova-test &#183; ~400 tokens</text>
  <rect x="72" y="800" width="10" height="16" rx="5" fill="#2dd4bf"/>
  <rect x="72" y="828" width="756" height="36" rx="10" fill="#0f766e"/>
  <text x="450" y="851" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">35,000+ tokens preserved for code</text>
  <text x="48" y="904" class="label">BUILT-IN SUMMARY EXTRACTORS</text>
  <rect x="48" y="914" width="84" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="90" y="941" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Rust</text>
  <rect x="160" y="914" width="69" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="195" y="941" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Go</text>
  <rect x="257" y="914" width="106" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="310" y="941" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Python</text>
  <rect x="392" y="914" width="130" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="457" y="941" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Node / TS</text>
  <rect x="550" y="914" width="109" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="604" y="941" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">C / C++</text>
  <rect x="687" y="914" width="165" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="770" y="941" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Java / Kotlin</text>
  <text x="48" y="976" font-size="13" fill="#64748b">-v / --verbose streams everything &#183; Unrecognized tools fall back to a tail summary.</text>
</svg>
