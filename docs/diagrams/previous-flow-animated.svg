        <!-- OLD PARTICLES (SLOW) -->
        <circle id="oparticle-1" r="5" class="particle-warn">
          <animateMotion id="oanim-p1" dur="20s" repeatCount="indefinite" rotate="auto"
            path="M 60 125 L 240 125 L 430 125 L 620 125 L 770 125 L 840 250 L 840 370 L 730 370 L 550 385 L 470 385 L 310 385 L 230 385 L 155 420 L 155 570 L 310 570 L 490 570 L 590 570 L 770 570 L 870 570" />
