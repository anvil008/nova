          <text x="325" y="560" class="node-title">Final PR to Main</text>
          <text x="325" y="580" class="node-subtitle">PR #6 (Milestone PR)</text>
          <text x="325" y="595" fill="#a855f7" font-size="10" font-weight="700">6th PR in milestone</text>
        </g>

        <g id="onode-ci6" class="node-group" onclick="selectOldNode(3)">
          <rect x="590" y="530" width="180" height="80" class="node-box" />
          <text x="605" y="560" class="node-title">GitHub Actions CI #6</text>
          <text x="605" y="580" class="node-subtitle">4 Jobs (24th total job)</text>
          <text x="605" y="595" fill="#f43f5e" font-size="10" font-weight="700">~4 mins additional wait</text>
        </g>

        <g id="onode-main" class="node-group" onclick="selectOldNode(3)">
          <rect x="870" y="530" width="150" height="80" class="node-box" />
          <text x="885" y="560" class="node-title">Trunk / main</text>
          <text x="885" y="580" class="node-subtitle">Merged after 90m</text>
          <text x="885" y="595" fill="#10b981" font-size="10" font-weight="700">Done</text>
