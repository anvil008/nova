          <text x="632" y="135" class="node-subtitle" fill="#fecdd3">gh pr checks --watch</text>
          <text x="632" y="149" fill="#f43f5e" font-size="10" font-weight="700">4 remote jobs spinning</text>
        </g>

        <g id="onode-s2" class="node-group" onclick="selectOldNode(0)">
          <rect x="60" y="175" width="120" height="60" class="node-box" />
          <text x="75" y="202" class="node-title">Specifier B</text>
          <text x="75" y="220" class="node-subtitle">tdd-guard seal</text>
        </g>

        <g id="onode-b2" class="node-group" onclick="selectOldNode(0)">
          <rect x="240" y="175" width="140" height="60" class="node-box" />
          <text x="252" y="200" class="node-title">Builder B</text>
          <text x="252" y="217" class="node-subtitle">Runs full suites</text>
        </g>

        <g id="onode-push2" class="node-group" onclick="selectOldNode(1)">
          <rect x="430" y="175" width="140" height="60" class="node-box" />
          <text x="442" y="200" class="node-title">Push & PR #2</text>
          <text x="442" y="217" class="node-subtitle">gh pr create</text>
        </g>

        <!-- STALL BOX 2 -->
        <g id="onode-stall2" class="node-group" onclick="selectOldNode(1)">
          <rect x="620" y="170" width="150" height="70" class="node-box node-stall" />
          <text x="632" y="197" class="node-title" fill="#fca5a5">⏳ STALLED 4m</text>
          <text x="632" y="215" class="node-subtitle" fill="#fecdd3">gh pr checks --watch</text>
          <text x="632" y="229" fill="#f43f5e" font-size="10" font-weight="700">4 remote jobs spinning</text>
        </g>

        <!-- Integrator Node -->
        <g id="onode-int" class="node-group" onclick="selectOldNode(2)">
