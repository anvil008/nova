<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 596" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">The mechanical gates a build wave passes through</title>
  <desc id="diagram-desc">tdd-guard turns TDD into a state machine two different agents pass through: one seals the tests, the other implements against them, and the Stop hook releases a pull request only on fresh evidence.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#8b949e"/></marker><marker id="arrow-muted" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#6e7681"/></marker></defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .label{font-size:14px;font-weight:600;fill:#e6edf3;text-anchor:middle}
    .sub{font-size:11.5px;font-style:italic;fill:#b9c4d0;text-anchor:middle}
    .title{font-size:16px;font-weight:700;fill:#e6edf3}
    .legend{font-size:11.5px;fill:#b9c4d0}
    .edgelabel{font-size:11.5px;fill:#b9c4d0}
    .chip{fill:#161b22;stroke:#30363d;stroke-width:1}
    .plate{fill:#0d1117}
    .edge{fill:none;stroke:#8b949e;stroke-width:1.6}
    .edge.dashed{stroke:#6e7681;stroke-dasharray:6 4}
    .frame{fill:none;stroke:#6f5aa8;stroke-width:1.4;stroke-dasharray:1 4;stroke-linecap:round}
    .frametext{font-size:11.5px;font-weight:600;fill:#b392f0}
    .crease{fill:none}
    .inner{fill:none;stroke-width:1}
    .k-agent{fill:#14243f;stroke:#6ea1ff;stroke-width:1.6}
    .k-gate{fill:#33280e;stroke:#e3b341;stroke-width:1.6}
    .k-human{fill:#102a1b;stroke:#56d364;stroke-width:1.6}
    .k-artifact{fill:#1b2027;stroke:#9aa4b2;stroke-width:1.6}
    .k-orchestrator{fill:#241c40;stroke:#b392f0;stroke-width:1.6}
  </style>
  <text class="title" x="20" y="32">The mechanical gates a build wave passes through</text>
  <rect class="k-agent" x="20" y="41" width="28" height="14" rx="3.92"/><text class="legend" text-anchor="start" x="52" y="52">agent</text><polygon class="k-gate" points="108.25,41 126.17,41 131.21,48 126.17,55 108.25,55 103.21,48"/><text class="legend" text-anchor="start" x="135.21" y="52">mechanical gate</text><path class="k-artifact" d="M 246.22 41 L 269.32 41 L 274.22 45.9 L 274.22 55 L 246.22 55 Z"/><path class="k-artifact crease" d="M 269.32 41 L 269.32 45.9 L 274.22 45.9"/><text class="legend" text-anchor="start" x="278.22" y="52">artifact</text>
  <path class="edge" marker-end="url(#arrow)" d="M 270 122 L 270 129 Q 270 136 277 136 L 433 136 Q 440 136 440 143 L 440 150"/>
  <path class="edge" marker-end="url(#arrow)" d="M 610 122 L 610 129 Q 610 136 603 136 L 447 136 Q 440 136 440 143 L 440 150"/>
  <path class="edge" marker-end="url(#arrow)" d="M 440 198 L 440 226"/>
  <path class="edge" marker-end="url(#arrow)" d="M 440 274 L 440 281 Q 440 288 433 288 L 281 288 Q 274 288 274 295 L 274 302"/>
  <path class="edge dashed" marker-end="url(#arrow-muted)" d="M 440 274 L 440 281 Q 440 288 447 288 L 599 288 Q 606 288 606 295 L 606 302"/>
  <path class="edge dashed" marker-end="url(#arrow-muted)" d="M 757 326 L 782 326 Q 791 326 791 317 L 791 259 Q 791 250 782 250 L 595 250"/>
  <path class="edge" marker-end="url(#arrow)" d="M 274 350 L 274 357 Q 274 364 281 364 L 433 364 Q 440 364 440 371 L 440 378"/>
  <path class="edge" marker-end="url(#arrow)" d="M 440 426 L 440 454"/>
  <path class="edge" marker-end="url(#arrow)" d="M 440 502 L 440 530"/>
  <path class="edge dashed" marker-end="url(#arrow-muted)" d="M 289 478 L 98 478 Q 89 478 89 469 L 89 259 Q 89 250 98 250 L 285 250"/>
  <rect class="k-agent" x="115" y="74" width="310" height="48" rx="10"/><text class="label" x="270" y="94.5">specifier</text><text class="sub" x="270" y="110">writes the acceptance tests, then runs RED</text>
  <rect class="k-agent" x="455" y="74" width="310" height="48" rx="10"/><text class="label" x="610" y="94.5">integrator (baseline)</text><text class="sub" x="610" y="110">behaviour-preserving work: proves the suite green</text>
  <polygon class="k-gate" points="305,150 575,150 591,174 575,198 305,198 289,174"/><text class="label" x="440" y="170.5">tdd-guard seal</text><text class="sub" x="440" y="186">kind: red, or kind: baseline for refactor work</text>
  <rect class="k-agent" x="285" y="226" width="310" height="48" rx="10"/><text class="label" x="440" y="246.5">builder implements</text><text class="sub" x="440" y="262">a different agent from the one that wrote the tests</text>
  <polygon class="k-gate" points="139,302 409,302 425,326 409,350 139,350 123,326"/><text class="label" x="274" y="322.5">tdd-guard verify</text><text class="sub" x="274" y="338">GREEN must postdate the seal</text>
  <polygon class="k-gate" points="471,302 741,302 757,326 741,350 471,350 455,326"/><text class="label" x="606" y="322.5">sealed path denied</text><text class="sub" x="606" y="338">amend only via reseal --reason</text>
  <polygon class="k-gate" points="305,378 575,378 591,402 575,426 305,426 289,402"/><text class="label" x="440" y="398.5">tdd-guard diff-review record</text><text class="sub" x="440" y="414">findings bound to the current diff</text>
  <polygon class="k-gate" points="305,454 575,454 591,478 575,502 305,502 289,478"/><text class="label" x="440" y="474.5">Stop hook</text><text class="sub" x="440" y="490">is every piece of evidence fresh?</text>
  <path class="k-artifact" d="M 295 530 L 571 530 L 585 544 L 585 578 L 295 578 Z"/><path class="k-artifact crease" d="M 571 530 L 571 544 L 585 544"/><text class="label" x="440" y="550.5">PR allowed</text><text class="sub" x="440" y="566">the gate decides the merge, never a handoff</text>
  <rect class="chip" x="282.3" y="127" width="145.4" height="18" rx="5"/><text class="edgelabel" text-anchor="middle" x="355" y="140">RED is real and non-zero</text>
  <rect class="chip" x="452.93" y="127" width="144.14" height="18" rx="5"/><text class="edgelabel" text-anchor="middle" x="525" y="140">the baseline run is green</text>
  <rect class="chip" x="383.29" y="203" width="113.43" height="18" rx="5"/><text class="edgelabel" text-anchor="middle" x="440" y="216">handoff --to builder</text>
  
  <rect class="chip" x="467.26" y="279" width="111.47" height="18" rx="5"/><text class="edgelabel" text-anchor="middle" x="523" y="292">edits a sealed test</text>
  
  
  
  <rect class="chip" x="424.51" y="507" width="30.98" height="18" rx="5"/><text class="edgelabel" text-anchor="middle" x="440" y="520">yes</text>
  <rect class="chip" x="92" y="355" width="99.63" height="18" rx="5"/><text class="edgelabel" text-anchor="start" x="98" y="368">missing or stale</text>
</svg>
