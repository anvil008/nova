<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1240" viewBox="0 0 1440 1240" role="img" aria-labelledby="title desc">
<title id="title">Workcell harness connection map</title><desc id="desc">The user directs the main agent. Instructions and skills guide its work. The native harness executes tool calls against the repository. Optional helpers return evidence, configured hooks format and lint edited files, project knowledge supplies retained lessons, and Dagr records explicitly reported run progress. The main agent verifies results and produces reports and authorized delivery.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e7eadd" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2c6243"/></marker><marker id="optional" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#6a805b"/></marker><linearGradient id="core" x2="1" y2="1"><stop stop-color="#e7efd9"/><stop offset="1" stop-color="#d6edb6"/></linearGradient></defs>
<style>text{font-family:system-ui,sans-serif;fill:#213c2b}.eyebrow{font-family:ui-monospace,monospace;font-size:12px;letter-spacing:2px;fill:#2c6243}.heading{font-size:22px;font-weight:700}.body{font-size:16px;fill:#596d5d}.label{font-size:13px;fill:#2c6243;paint-order:stroke;stroke:#f6f5ee;stroke-width:6;stroke-linejoin:round}.optlabel{fill:#596d5d}.edge{fill:none;stroke:#2c6243;stroke-width:2;marker-end:url(#arrow)}.opt{stroke:#6a805b;stroke-dasharray:7 6;marker-end:url(#optional)}.box{fill:#fffef9;stroke:#d5dfce;stroke-width:1.5}.optionalbox{stroke:#93a784}.core{fill:url(#core);stroke:#2c6243;stroke-width:2}</style>
<rect width="1440" height="1240" rx="22" fill="#f6f5ee"/><rect width="1440" height="1240" rx="22" fill="url(#grid)"/>
<text x="54" y="53" class="eyebrow">WORKCELL / CONNECTION MAP</text><text x="54" y="98" font-size="36" font-weight="700">One agent. A connected working system.</text><text x="54" y="132" class="body">Native harness: Codex · Claude Code · Antigravity — capabilities depend on configuration.</text>

