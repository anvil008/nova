  <rect class="plate" x="155" y="224" width="577.01" height="17"/><text class="frametext" x="161" y="237">Team sizes follow useful work and runtime capacity; existing decisions and evidence are retained</text>
  <path class="k-artifact" d="M 358 74 L 668 74 L 682 88 L 682 122 L 358 122 Z"/><path class="k-artifact crease" d="M 668 74 L 668 88 L 682 88"/><text class="label" x="520" y="94.5">Goal or existing evidence</text><text class="sub" x="520" y="110">request · selected plan · review or profile findings</text>
  <rect class="k-orchestrator" x="357" y="150" width="326" height="48" rx="10"/><rect class="k-orchestrator inner" x="361" y="154" width="318" height="40" rx="6"/><text class="label" x="520" y="170.5">orchestrator frames the work</text><text class="sub" x="520" y="186">reuse scope, decisions, source, and authorization</text>
  <rect class="k-human" x="348" y="248" width="344" height="48" rx="24"/><text class="label" x="520" y="268.5">one plan or multiple ideas?</text><text class="sub" x="520" y="284">ask only when a new plan choice is missing</text>
  <rect class="k-agent" x="349" y="324" width="342" height="48" rx="10"/><text class="label" x="520" y="344.5">planners × N</text><text class="sub" x="520" y="360">distinct approaches · orchestrator chooses the team</text>
  <rect class="k-agent" x="349" y="400" width="342" height="48" rx="10"/><text class="label" x="520" y="420.5">researchers × N when useful</text><text class="sub" x="520" y="436">planner-owned questions · native or proxy dispatch</text>
  <path class="k-artifact" d="M 358 476 L 668 476 L 682 490 L 682 524 L 358 524 Z"/><path class="k-artifact crease" d="M 668 476 L 668 490 L 682 490"/><text class="label" x="520" y="496.5">planner-authored plan</text><text class="sub" x="520" y="512">Markdown default · requested HTML companion</text>
  <rect class="k-orchestrator" x="357" y="552" width="326" height="48" rx="10"/><rect class="k-orchestrator inner" x="361" y="556" width="318" height="40" rx="6"/><text class="label" x="520" y="572.5">compare and review the plan</text><text class="sub" x="520" y="588">accept · revise · resolve material user decisions</text>
  <rect class="k-human" x="348" y="628" width="344" height="48" rx="24"/><text class="label" x="520" y="648.5">continue to build?</text><text class="sub" x="520" y="664">ask for standalone plans; reuse existing authorization</text>
  <path class="k-artifact" d="M 358 704 L 668 704 L 682 718 L 682 752 L 358 752 Z"/><path class="k-artifact crease" d="M 668 704 L 668 718 L 682 718"/><text class="label" x="520" y="724.5">executable tasks</text><text class="sub" x="520" y="740">local task keys · optional approved GitHub issues</text>
  <rect class="k-orchestrator" x="357" y="780" width="326" height="48" rx="10"/><rect class="k-orchestrator inner" x="361" y="784" width="318" height="40" rx="6"/><text class="label" x="520" y="800.5">choose verification per task</text><text class="sub" x="520" y="816">schedule independent work; preserve dependencies</text>
  <rect class="k-agent" x="163" y="856" width="342" height="48" rx="10"/><text class="label" x="334" y="876.5">specifiers × N</text><text class="sub" x="334" y="892">feature or fix: real RED and sealed acceptance tests</text>
  <rect class="k-agent" x="535" y="856" width="342" height="48" rx="10"/><text class="label" x="706" y="876.5">integrators × N: baseline</text><text class="sub" x="706" y="892">preserve behavior: GREEN on protected existing tests</text>
  <rect class="k-agent" x="349" y="932" width="342" height="48" rx="10"/><text class="label" x="520" y="952.5">builders × N</text><text class="sub" x="520" y="968">separate ownership · implement against protected tests</text>
  <rect class="k-agent" x="349" y="1008" width="342" height="48" rx="10"/><text class="label" x="520" y="1028.5">reviewers × N</text><text class="sub" x="520" y="1044">independent findings · orchestrator directs repairs</text>
  <path class="k-artifact" d="M 358 1084 L 668 1084 L 682 1098 L 682 1132 L 358 1132 Z"/><path class="k-artifact crease" d="M 668 1084 L 668 1098 L 682 1098"/><text class="label" x="520" y="1104.5">accepted task handoffs</text><text class="sub" x="520" y="1120">immutable commits · source-bound evidence</text>
  <rect class="k-orchestrator" x="357" y="1160" width="326" height="48" rx="10"/><rect class="k-orchestrator inner" x="361" y="1164" width="318" height="40" rx="6"/><text class="label" x="520" y="1180.5">coordinate combined source</text><text class="sub" x="520" y="1196">preserve accepted commits and their provenance</text>
  <rect class="k-agent" x="349" y="1236" width="342" height="48" rx="10"/><text class="label" x="520" y="1256.5">documenter</text><text class="sub" x="520" y="1272">relevant documentation before final verification</text>
  <rect class="k-agent" x="349" y="1312" width="342" height="48" rx="10"/><text class="label" x="520" y="1332.5">integrators × N: final verification</text><text class="sub" x="520" y="1348">exact combined source · tests, docs, and runtime</text>
  <rect class="k-agent" x="349" y="1388" width="342" height="48" rx="10"/><text class="label" x="520" y="1408.5">profilers × N when optimizing</text><text class="sub" x="520" y="1424">repeat a comparable benchmark after the change</text>
  <polygon class="k-gate" points="370,1464 670,1464 686,1488 670,1512 370,1512 354,1488"/><text class="label" x="520" y="1484.5">prepared receipt</text><text class="sub" x="520" y="1500">fresh source gates · final checks · current commit</text>
  <rect class="k-orchestrator" x="357" y="1540" width="326" height="48" rx="10"/><rect class="k-orchestrator inner" x="361" y="1544" width="318" height="40" rx="6"/><text class="label" x="520" y="1560.5">orchestrator accepts</text><text class="sub" x="520" y="1576">durable completion · final PR · authorized merge</text>
  <rect class="k-agent" x="349" y="1616" width="342" height="48" rx="10"/><text class="label" x="520" y="1636.5">deployer when requested</text><text class="sub" x="520" y="1652">approved target and commit · verification and rollback</text>
  <rect class="chip" x="443.62" y="214" width="152.76" height="18" rx="5"/><text class="edgelabel" text-anchor="middle" x="520" y="227">planning detail is missing</text>
  <rect class="chip" x="770.49" y="442" width="145.52" height="18" rx="5"/><text class="edgelabel" text-anchor="end" x="910" y="455">reuse an executable plan</text>
  <rect class="chip" x="451.38" y="377" width="137.24" height="18" rx="5"/><text class="edgelabel" text-anchor="middle" x="520" y="390">internal evidence stage</text>
  <rect class="chip" x="434.94" y="681" width="170.13" height="18" rx="5"/><text class="edgelabel" text-anchor="middle" x="520" y="694">implementation is authorized</text>
  <rect class="chip" x="386.85" y="833" width="80.31" height="18" rx="5"/><text class="edgelabel" text-anchor="middle" x="427" y="846">feature or fix</text>
  <rect class="chip" x="554.16" y="833" width="117.68" height="18" rx="5"/><text class="edgelabel" text-anchor="middle" x="613" y="846">behavior-preserving</text>
  <rect class="chip" x="395.76" y="909" width="62.48" height="18" rx="5"/><text class="edgelabel" text-anchor="middle" x="427" y="922">RED seal</text>
  <rect class="chip" x="570.95" y="909" width="84.1" height="18" rx="5"/><text class="edgelabel" text-anchor="middle" x="613" y="922">baseline seal</text>
  <rect class="chip" x="443.1" y="1061" width="153.8" height="18" rx="5"/><text class="edgelabel" text-anchor="middle" x="520" y="1074">blocking findings resolved</text>
  <rect class="chip" x="456.84" y="1365" width="126.31" height="18" rx="5"/><text class="edgelabel" text-anchor="middle" x="520" y="1378">performance changes</text>
  <rect class="chip" x="938" y="1403" width="86.52" height="18" rx="5"/><text class="edgelabel" text-anchor="start" x="944" y="1416">other changes</text>
  <rect class="chip" x="493.53" y="1517" width="52.94" height="18" rx="5"/><text class="edgelabel" text-anchor="middle" x="520" y="1530">verified</text>
  <rect class="chip" x="446.09" y="1593" width="147.82" height="18" rx="5"/><text class="edgelabel" text-anchor="middle" x="520" y="1606">deployment is authorized</text>
  <rect class="chip" x="845.84" y="985" width="102.16" height="18" rx="5"/><text class="edgelabel" text-anchor="end" x="942" y="998">actionable repair</text>
  <rect class="chip" x="812.73" y="1213" width="151.27" height="18" rx="5"/><text class="edgelabel" text-anchor="end" x="958" y="1226">missing or stale evidence</text>
  <rect class="chip" x="124" y="453" width="134.82" height="18" rx="5"/><text class="edgelabel" text-anchor="start" x="130" y="466">specific plan revisions</text>
</svg>
