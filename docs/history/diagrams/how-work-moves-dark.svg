    .plate{fill:#0d1117}
    .edge{fill:none;stroke:#8b949e;stroke-width:1.6}
    .edge.dashed{stroke:#6e7681;stroke-dasharray:6 4}
    .frame{fill:none;stroke:#6f5aa8;stroke-width:1.4;stroke-dasharray:1 4;stroke-linecap:round}
    .frametext{font-size:11.5px;font-weight:600;fill:#b392f0}
    .crease{fill:none}
    .inner{fill:none;stroke-width:1}
    .k-agent{fill:#14243f;stroke:#6ea1ff;stroke-width:1.6}
    .k-gate{fill:#33280e;stroke:#e3b341;stroke-width:1.6}
    .k-human{fill:#102a1b;stroke:#56d364;stroke-width:1.6}
    .k-artifact{fill:#1b2027;stroke:#9aa4b2;stroke-width:1.6}
    .k-orchestrator{fill:#241c40;stroke:#b392f0;stroke-width:1.6}
  </style>
  <text class="title" x="20" y="32">How work moves through Nova</text>
  <rect class="k-agent" x="20" y="41" width="28" height="14" rx="3.92"/><text class="legend" text-anchor="start" x="52" y="52">agent</text><polygon class="k-gate" points="108.25,41 126.17,41 131.21,48 126.17,55 108.25,55 103.21,48"/><text class="legend" text-anchor="start" x="135.21" y="52">mechanical gate</text><rect class="k-human" x="246.22" y="41" width="28" height="14" rx="7"/><text class="legend" text-anchor="start" x="278.22" y="52">human gate</text><path class="k-artifact" d="M 362.44 41 L 385.54 41 L 390.44 45.9 L 390.44 55 L 362.44 55 Z"/><path class="k-artifact crease" d="M 385.54 41 L 385.54 45.9 L 390.44 45.9"/><text class="legend" text-anchor="start" x="394.44" y="52">artifact</text><rect class="k-orchestrator" x="454.96" y="41" width="28" height="14" rx="3.92"/><rect class="k-orchestrator inner" x="457.2" y="43.24" width="23.52" height="9.52" rx="1.68"/><text class="legend" text-anchor="start" x="486.96" y="52">orchestrator</text>
