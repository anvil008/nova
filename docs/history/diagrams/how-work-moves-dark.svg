<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1696" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">How work moves through Nova</title>
  <desc id="diagram-desc">The orchestrator reuses existing plans or delegates one plan or multiple ideas to planner agents with internal research. Authorized work enters shared build with optional GitHub tracking, RED or baseline verification, builders and independent reviewers. Relevant documentation enters the combined source before final integrator verification; optimization is remeasured. Fresh evidence gates final acceptance and authorized delivery. Team sizes are chosen by the orchestrator.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#8b949e"/></marker><marker id="arrow-muted" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#6e7681"/></marker></defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
